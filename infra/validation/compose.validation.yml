{
  "name": "yuni-validation",
  "services": {
    "validation-postgres": {
      "image": "postgres:16-alpine",
      "container_name": "yuni-validation-postgres",
      "environment": {
        "POSTGRES_DB": "yuni_validation_test",
        "POSTGRES_USER": "${VALIDATION_POSTGRES_USER:?Required}",
        "POSTGRES_PASSWORD": "${VALIDATION_POSTGRES_PASSWORD:?Required}"
      },
      "ports": [
        {
          "target": 5432,
          "published": "${VALIDATION_POSTGRES_PORT:?Required}",
          "host_ip": "127.0.0.1",
          "protocol": "tcp"
        }
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "validation_postgres_data",
          "target": "/var/lib/postgresql/data"
        }
      ],
      "networks": {
        "validation_network": {}
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20,
        "start_period": "5s"
      },
      "labels": {
        "io.yuni.validation.run": "${VALIDATION_RUN_ID:?Runner required}",
        "io.yuni.validation.environment": "yuni-audit-validation"
      }
    }
  },
  "volumes": {
    "validation_postgres_data": {
      "name": "yuni-validation-postgres-data",
      "driver": "local",
      "labels": {
        "io.yuni.validation.run": "${VALIDATION_RUN_ID:?Runner required}",
        "io.yuni.validation.environment": "yuni-audit-validation"
      }
    }
  },
  "networks": {
    "validation_network": {
      "name": "yuni-validation-network",
      "driver": "bridge",
      "labels": {
        "io.yuni.validation.run": "${VALIDATION_RUN_ID:?Runner required}",
        "io.yuni.validation.environment": "yuni-audit-validation"
      }
    }
  }
}
